<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TGS Survey REV03</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>TGS PLATFORM</h1>
    <span>Survey REV03</span>
</header>

<main class="container">

    <!-- ========================= -->
    <!-- THÔNG TIN CÔNG TRÌNH -->
    <!-- ========================= -->

    <section class="card">

        <h2>📋 Khảo sát hiện trạng</h2>

        <label>Công trình</label>
        <input id="projectName"
               type="text"
               placeholder="Nhập tên công trình">

        <label>Địa điểm</label>
        <input id="location"
               type="text"
               placeholder="Xã / Huyện">

        <label>Kỹ sư khảo sát</label>
        <input id="engineer"
               type="text"
               placeholder="Họ tên kỹ sư">

    </section>

    <!-- ========================= -->
    <!-- HẠNG MỤC -->
    <!-- ========================= -->

    <section class="card">

        <div class="row-between">
            <h2>🏗️ Hạng mục khảo sát</h2>

            <button id="addCategory" class="btn-green">
                + Hạng mục
            </button>
        </div>

        <div id="categoryContainer">

            <!-- Hạng mục sẽ sinh bằng JS -->

        </div>

    </section>

    <!-- ========================= -->
    <!-- GPS -->
    <!-- ========================= -->

    <section class="card gps-card">

        <div class="gps-info">

            <div>
                <strong>📍 GPS</strong>
                <p id="gpsStatus">Chưa lấy vị trí</p>
            </div>

            <div class="rec-status">

                <span id="recDot"></span>
                <strong id="timer">00:00</strong>

            </div>

        </div>

        <button id="btnGPS" class="btn-primary">
            Lấy GPS
        </button>

    </section>

    <!-- ========================= -->
    <!-- CAMERA -->
    <!-- ========================= -->

    <section class="camera-panel" id="cameraPanel">

        <div class="camera-header">

            <div>
                <strong id="cameraTitle">
                    Chưa bắt đầu khảo sát
                </strong>

                <small id="cameraSubtitle">
                    Hãy chọn Hạng mục và Bộ phận
                </small>
            </div>

            <button id="btnCloseCamera"
                    class="icon-btn hidden">
                ✕
            </button>

        </div>

        <video id="preview"
               autoplay
               muted
               playsinline>
        </video>

        <!-- Zoom -->

        <div class="zoom-bar hidden" id="zoomBar">

            <button class="zoom-btn" data-zoom="1">
                1×
            </button>

            <button class="zoom-btn" data-zoom="2">
                2×
            </button>

            <button class="zoom-btn" data-zoom="3">
                3×
            </button>

        </div>

        <!-- Điều khiển -->

        <div class="camera-controls">

            <button id="btnStart" class="btn-primary">
                Bắt đầu khảo sát
            </button>

            <button id="btnRecord"
                    class="btn-red hidden">
                REC
            </button>

            <button id="btnPause"
                    class="btn-orange hidden">
                Tạm dừng
            </button>

            <button id="btnPhoto"
                    class="btn-blue hidden">
                Chụp ảnh
            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- TIMELINE -->
    <!-- ========================= -->

    <section class="card">

        <div class="row-between">

            <h2>🖼️ Timeline hiện trường</h2>

            <span id="timelineCount">
                0 mục
            </span>

        </div>

        <div id="timeline" class="timeline">

            <div class="empty">
                Chưa có dữ liệu hiện trường
            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- HOÀN THÀNH -->
    <!-- ========================= -->

    <section class="card">

        <h2>📦 Hoàn thành khảo sát</h2>

        <button id="btnFinish"
                class="btn-success">
            Hoàn thành khảo sát
        </button>

        <button id="btnExport"
                class="btn-dark">
            Xuất JSON
        </button>

        <p id="saveStatus" class="save-status">
            Chưa lưu
        </p>

    </section>

</main>

<!-- Toast -->

<div id="toast" class="toast hidden">
    Đã lưu
</div>

<script src="db.js"></script>
<script src="app.js"></script>

</body>
</html>
